<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 • Page Not Found</title>

<style>
:root{
    --bg-top:#2d1731;
    --bg-mid:#0b2f3f;
    --bg-bottom:#081d38;
    --text:#e9f5ff;
    --primary:#4ab7ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Inter,system-ui,sans-serif;
    color:var(--text);
    background:
    radial-gradient(circle at center,
    rgba(74,183,255,.08),
    transparent 55%),
    linear-gradient(
      to bottom,
      var(--bg-top),
      var(--bg-mid),
      var(--bg-bottom)
    );
}

.container{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.error-code{
    font-size:clamp(120px,20vw,220px);
    font-weight:800;
    line-height:1;
    letter-spacing:8px;
    background:linear-gradient(
      45deg,
      #fff,
      #4ab7ff
    );
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(74,183,255,.25);
}

.error-title{
    margin-top:10px;
    font-size:clamp(24px,4vw,42px);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.15em;
}

.error-desc{
    margin-top:18px;
    max-width:650px;
    color:rgba(233,245,255,.7);
    line-height:1.8;
    letter-spacing:.08em;
}

.btn-group{
    margin-top:40px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    text-decoration:none;
    color:white;
    padding:14px 28px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(10px);
    transition:.3s;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:12px;
}

.btn:hover{
    transform:translateY(-3px);
    border-color:var(--primary);
    box-shadow:0 0 25px rgba(74,183,255,.2);
}

.primary{
    background:rgba(74,183,255,.15);
}

.logo{
    position:absolute;
    top:30px;
    left:40px;
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:white;
}

.logo img{
    width:36px;
    height:36px;
    border-radius:50%;
}

.logo span{
    letter-spacing:.3em;
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:radial-gradient(
      circle,
      rgba(74,183,255,.12),
      transparent 70%
    );
    filter:blur(40px);
    animation:float 8s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-30px);
    }
}

.footer{
    position:absolute;
    bottom:25px;
    width:100%;
    text-align:center;
    font-size:11px;
    color:rgba(255,255,255,.5);
    letter-spacing:.15em;
    text-transform:uppercase;
}
</style>
</head>

<body>

<div class="glow"></div>

<a href="/" class="logo">
    <img src="circle_logo.png" alt="RyGen">
    <span>RYGEN</span>
</a>

<div class="container">

    <div class="error-code">404</div>

    <h1 class="error-title">
        Page Not Found
    </h1>

    <p class="error-desc">
        The page you're looking for doesn't exist, was moved,
        or is currently unavailable. Let's get you back on track.
    </p>

    <div class="btn-group">
        <a href="/" class="btn primary">
            Return Home
        </a>
        <a href="/docs" class="btn">
            Documentation
        </a>
    </div>
</div>
<div class="footer">RYGEN.IO • ALL RIGHTS RESERVED • 2026</div>

</body>
</html>
