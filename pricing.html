<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rize with RyGen</title>
  <link rel="icon" type="image/png" href="circle_logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-top: #2d1731;
      --bg-mid: #0b2f3f;
      --bg-bottom: #081d38; 
      --text: #e9f5ff;
      --text-dim: rgba(233, 245, 255, 0.6);
      --primary: #4ab7ff;
      --border: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(0, 20, 40, 0.3);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #040e1c; 
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    /* Background Elements */
    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, rgba(25, 88, 112, 0.18) 0%, rgba(8, 13, 22, 0.06) 36%, rgba(8, 29, 56, 0.96) 100%),
        linear-gradient(to bottom, var(--bg-top) 0%, #143142 18%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      z-index: 0;
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; image-rendering: pixelated; }
    
    .noise {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.12;
      background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 3px, 3px 100%; mix-blend-mode: soft-light; z-index: 2;
    }

    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.18) 52%, rgba(0,0,0,0.48) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.06) 18%, rgba(0,0,0,0.08) 82%, rgba(0,0,0,0.28));
      z-index: 3;
    }
    
    /* Scrollable Content Wrapper */
    .content-wrapper {
      position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; z-index: 10;
      padding: 100px 40px 10px 40px; scroll-behavior: smooth; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box;
    }
    
    .content-wrapper::-webkit-scrollbar { width: 8px; }
    .content-wrapper::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .content-wrapper::-webkit-scrollbar-thumb { background: rgba(74, 183, 255, 0.3); }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%; padding: 24px 40px;
      display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 20;
      background: linear-gradient(to bottom, rgba(4, 14, 28, 0.9), transparent);
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
    .nav-brand img { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }
    .nav-brand span { font-size: 18px; font-weight: 500; letter-spacing: 0.3em; }

    .btn {
      text-decoration: none; display: inline-block; appearance: none;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03); color: var(--text);
      padding: 10px 20px; font-size: 11px; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase;
      backdrop-filter: blur(12px); transition: all 0.3s ease; cursor: pointer;
    }
    .btn:hover { border-color: rgba(255, 255, 255, 0.4); transform: translateY(-2px); }

    /* Header Section */
    .page-header { text-align: center; margin-bottom: 40px; }
    .page-title { font-size: clamp(26px, 4vw, 46px); font-weight: 700; letter-spacing: 0.05em; margin: 0 0 10px 0; text-transform: uppercase; background: linear-gradient(45deg, #ffffff 30%, #4ab7ff 70%); -webkit-background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(74, 183, 255, 0.3); }
    .page-subtitle { color: var(--text-dim); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; }

    /* Filters & Search */
    .controls-container { max-width: 1400px; margin: 0 auto 40px auto; display: flex; flex-direction: column; gap: 20px; }
    
    .search-wrapper { display: flex; justify-content: flex-end; width: 100%; }
    .search-bar { width: 100%; max-width: 280px; padding: 12px 16px; background: var(--glass-bg); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-family: 'JetBrains Mono', monospace; outline: none; transition: 0.3s; backdrop-filter: blur(10px); }
    .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(74, 183, 255, 0.15); }
    .search-bar::placeholder { color: rgba(255,255,255,0.3); }

    .category-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
    
    .tab { background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 18px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px); }
    .tab:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
    .tab.active { background: rgba(74, 183, 255, 0.15); border-color: var(--primary); color: #fff; box-shadow: 0 0 15px rgba(74, 183, 255, 0.2); }

    /* Model Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; max-width: 1400px; margin: 0 auto; }
    
    /* Model Card */
    .card { background: var(--glass-bg); border: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; backdrop-filter: blur(12px); transition: all 0.3s ease; position: relative; overflow: hidden; }
    .card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(74, 183, 255, 0.05); }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-title { font-size: 15px; font-weight: 600; margin: 0; color: #fff; word-break: break-all; line-height: 1.3; }
    .provider-badge { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--primary); border: 1px solid rgba(74, 183, 255, 0.3); padding: 4px 8px; background: rgba(74, 183, 255, 0.05); white-space: nowrap; margin-left: 10px; }
    
    /* Code Block for Copying */
    .model-code { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 8px 12px; font-size: 10.5px; font-family: 'JetBrains Mono', monospace; color: var(--primary); cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; transition: 0.2s; }
    .model-code:hover { background: rgba(74, 183, 255, 0.1); border-color: rgba(74, 183, 255, 0.3); }
    .model-code svg { width: 12px; height: 12px; fill: currentColor; opacity: 0.7; }
    .model-code:hover svg { opacity: 1; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .tag { font-size: 9px; font-family: 'JetBrains Mono', monospace; padding: 4px 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #a2cfff; text-transform: uppercase; }

    .divider { height: 1px; background: var(--border); margin: 15px 0; }

    /* Stats & Pricing Data */
    .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .data-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } /* New class for 3 column row */
    
    .data-item { display: flex; flex-direction: column; gap: 4px; }
    .label { font-size: 9px; letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase; }
    .value { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #fff; }
    .value.price { color: #00e676; }

    /* Loader & Errors */
    .loader { text-align: center; color: var(--primary); font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 50px; letter-spacing: 0.2em; animation: pulse 1.5s infinite; grid-column: 1/-1;}
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    
    .no-results { grid-column: 1 / -1; text-align: center; padding: 40px; border: 1px dashed var(--border); color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

    /* Copyright Footer */
    .copyright { margin-top: auto; padding-top: 40px; text-align: center; color: rgba(255, 255, 255, 0.4); font-size: 10px;
                font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; pointer-events: none; }
    
    @media (max-width: 768px) {
      .navbar { padding: 15px 20px; }
      .content-wrapper { padding: 80px 20px 40px 20px; }
      .grid { grid-template-columns: 1fr; }
      .search-wrapper { justify-content: flex-start; }
      .search-bar { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Background Setup -->
  <div id="app">
    <canvas id="bg"></canvas>
    <div class="noise"></div>
    <div class="vignette"></div>
  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <img src="circle_logo.png" alt="RyGen Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNiIgaGVpZ2h0PSIzNiI+PGNpcmNsZSBjeD0iMTgiIGN5PSIxOCIgcj0iMTgiIGZpbGw9IiM0YWI3ZmYiLz48L3N2Zz4='">
      <span>RYGEN</span>
    </a>
    <a href="https://rygen.readme.io/reference" class="btn" target="_blank">API Docs</a>
  </nav>

  <!-- Main Content -->
  <div class="content-wrapper">
    <div class="page-header">
      <h1 class="page-title">Serverless Models</h1>
    </div>

    <div class="controls-container">
      <!-- Search Bar aligned to Right -->
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-bar" placeholder="> Search AI Models...">
      </div>
      
      <!-- Dynamic Categories (Multi-row) -->
      <div class="category-tabs" id="categoryTabs">
        <!-- Tabs will be injected via JS -->
      </div>
    </div>

    <!-- Models Grid -->
    <div class="grid" id="modelGrid">
      <div class="loader" id="loader">> INITIALIZING RYGEN API CONNECTION...</div>
    </div>

    <!-- Footer Copyright -->
    <p class="copyright">All Rights Reserved • RYGEN.IO • 2026</p>
  </div>
  
  <!-- API & Logic Script -->
  <script>
    const API_URL = 'https://rjviswha-cosr.hf.space/models';
    let allModels = [];
    let currentCategory = 'all';

    // Copy to Clipboard Logic
    window.copyModelName = function(text, element) {
      navigator.clipboard.writeText(text);
      const originalHTML = element.innerHTML;
      element.innerHTML = `<span style="color:#00e676;">✓ COPIED TO CLIPBOARD</span>`;
      element.style.borderColor = "#00e676";
      setTimeout(() => {
        element.innerHTML = originalHTML;
        element.style.borderColor = "var(--border)";
      }, 1500);
    }

    // Utilities
    const extractProvider = (modelName) => modelName.includes('/') ? modelName.split('/')[0] : 'RyGen';
    const extractName = (modelName) => modelName.includes('/') ? modelName.split('/').slice(1).join('/') : modelName;
    
    const formatTokens = (num) => {
      if (!num) return 'N/A';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
      return num;
    };
    
    // --- SMART PRICING LOGIC (5% Margin + Round down to 0.05) ---
    const applyMarginAndFloor = (amount) => {
      if (amount === null || amount === undefined || isNaN(amount)) return null;
      let withMargin = amount * 1.05; // Add 5% Margin
      if (withMargin < 0.05) { return withMargin; }
      return Math.floor(withMargin * 20) / 20;
    };
    
    const formatPricePerMillion = (centsPerToken) => {
      if (centsPerToken === null || centsPerToken === undefined) return 'N/A';
      const dollars = centsPerToken * 10000;
      const finalPrice = applyMarginAndFloor(dollars);
      return `$${finalPrice.toFixed(2)}`;
    };
    
    const formatCachedPrice = (val) => {
      if (val === null || val === undefined || val === 0) return 'N/A';
      const dollars = 0.01 / val;
      const finalPrice = applyMarginAndFloor(dollars);
      return `$${finalPrice.toFixed(2)}`;
    };
    
    // Main Fetch
    async function fetchModels() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        allModels = data;
        
        setupCategories();
        filterAndRender();
      } catch (err) {
        document.getElementById('modelGrid').innerHTML = `<div class="no-results">[ ERROR: FAILED TO CONNECT TO SECURE SERVER ]</div>`;
      }
    }

    // Setup Category Tabs
    function setupCategories() {
      const tabsContainer = document.getElementById('categoryTabs');
      let providers = new Set();
      
      allModels.forEach(m => providers.add(extractProvider(m.model_name).toLowerCase()));
      providers = Array.from(providers).sort();

      // Set Default to Moonshot if exists, else 'all'
      if (providers.includes('deepseek-ai')) {
        currentCategory = 'deepseek-ai';
      } else if (providers.includes('moonshot')) {
        currentCategory = 'moonshot';
      }

      let tabsHTML = `<button class="tab ${currentCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">ALL</button>`;
      
      providers.forEach(p => {
        const isActive = currentCategory === p ? 'active' : '';
        tabsHTML += `<button class="tab ${isActive}" onclick="setCategory('${p}')">${p}</button>`;
      });

      tabsContainer.innerHTML = tabsHTML;
    }

    // Set Category from Tab click
    window.setCategory = function(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.innerText.toLowerCase() === cat);
      });
      // Clear search when selecting a new category manually
      document.getElementById('searchInput').value = ''; 
      filterAndRender();
    };

    // Search Input Listener
    document.getElementById('searchInput').addEventListener('input', filterAndRender);

    // Filter & Render Cards
    function filterAndRender() {
      const grid = document.getElementById('modelGrid');
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allModels.filter(m => {
        const provider = extractProvider(m.model_name).toLowerCase();
        
        // Global Search overrides Category selection
        const matchesCategory = query.length > 0 ? true : (currentCategory === 'all' || provider === currentCategory);
        const matchesSearch = m.model_name.toLowerCase().includes(query) || (m.tags && m.tags.some(t => t.toLowerCase().includes(query)));
        
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results">SYSTEM LOG: 0 MODELS MATCHING CRITERIA FOUND.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(model => {
        const provider = extractProvider(model.model_name);
        const name = extractName(model.model_name);
        
        // Output All Tags without slice
        let allTagsHTML = '';
        if (model.quantization) allTagsHTML += `<span class="tag" style="color:#4ab7ff; border-color: rgba(74, 183, 255, 0.4)">${model.quantization.toUpperCase()}</span>`;
        if (model.tags) allTagsHTML += model.tags.map(t => `<span class="tag">${t}</span>`).join('');

        return `
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">${name}</h2>
              <span class="provider-badge">${provider}</span>
            </div>
            
            <div class="model-code" onclick="copyModelName('${model.model_name}', this)">
              <span>${model.model_name}</span>
              <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </div>

            <div class="tags">${allTagsHTML}</div>

            <div class="data-grid">
              <div class="data-item">
                <span class="label">Context Window</span>
                <span class="value">${formatTokens(model.max_tokens)}</span>
              </div>
              <div class="data-item">
                <span class="label">Status</span>
                <span class="value price">Active</span>
              </div>
            </div>

            <div class="divider"></div>

            <!-- Single line pricing row (3 columns) -->
            <div class="data-grid-3">
              <div class="data-item">
                <span class="label">Input/1M</span>
                <span class="value price">${formatPricePerMillion(model.pricing?.cents_per_input_token)}</span>
              </div>
              <div class="data-item">
                <span class="label">Cached/1M</span>
                <span class="value" style="color:#a2cfff">${formatCachedPrice(model.pricing?.rate_per_input_token_cached)}</span>
              </div>
              <div class="data-item">
                <span class="label">Output/1M</span>
                <span class="value price">${formatPricePerMillion(model.pricing?.cents_per_output_token)}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Start App
    fetchModels();

  </script>
  <!-- Background Animation Script (Untouched) -->
  <script>
    (() => {
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d', { alpha: false });
      let w = 0, h = 0, dpr = 1; let grid = []; let cols = 0, rows = 0; const baseCell = 22;
      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function smoothstep(t) { return t * t * (3 - 2 * t); }
      function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); }
      function noise2(x, y) {
        const ix = Math.floor(x), iy = Math.floor(y); const fx = x - ix, fy = y - iy;
        const a = hash2(ix, iy); const b = hash2(ix + 1, iy); const c = hash2(ix, iy + 1); const d = hash2(ix + 1, iy + 1);
        const ux = smoothstep(fx); const uy = smoothstep(fy);
        return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
      }
      function fbm(x, y, t) {
        let total = 0; let amp = 0.5; let freq = 0.9;
        for (let i = 0; i < 4; i++) { total += amp * noise2(x * freq + t * 0.08, y * freq - t * 0.05); freq *= 2.0; amp *= 0.5; }
        return total;
      }
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2); w = Math.floor(window.innerWidth); h = Math.floor(window.innerHeight);
        canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr); canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cols = Math.ceil(w / baseCell) + 2; rows = Math.ceil(h / baseCell) + 2; grid = [];
        for (let y = 0; y < rows; y++) { for (let x = 0; x < cols; x++) { grid.push({ x, y, seed: Math.random() * 1000, size: baseCell * (0.8 + Math.random() * 1.55), depth: Math.random(), hueShift: Math.random() * 0.9 }); } }
      }
      function drawBackground(t) {
        const cx = w * 0.5; const cy = h * 0.43; const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0.00, '#2e1733'); grad.addColorStop(0.18, '#173747'); grad.addColorStop(0.48, '#0b2b3a'); grad.addColorStop(1.00, '#081d38'); 
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        const g1 = ctx.createRadialGradient(cx * 0.95, cy * 0.72, 0, cx * 0.95, cy * 0.72, Math.max(w, h) * 0.7);
        g1.addColorStop(0, 'rgba(95, 201, 231, 0.18)'); g1.addColorStop(0.35, 'rgba(48, 128, 163, 0.10)'); g1.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g1; ctx.fillRect(0, 0, w, h);
        const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.55);
        g2.addColorStop(0, 'rgba(255,255,255,0.04)'); g2.addColorStop(0.25, 'rgba(255,255,255,0.02)'); g2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g2; ctx.fillRect(0, 0, w, h);
      }
      function blockColor(nx, ny, t, depth) {
        const vertical = clamp(ny, 0, 1); const band = fbm(nx * 2.4, ny * 2.0, t + depth * 2.1);
        const drift = Math.sin((nx * 3.5 + t * 0.55) + depth * 6.3) * 0.5 + 0.5;
        let r = 10, g = 18, b = 28;
        if (vertical < 0.24) { r = lerp(56, 28, vertical / 0.24); g = lerp(18, 38, vertical / 0.24); b = lerp(52, 64, vertical / 0.24);
        } else if (vertical < 0.62) { const u = (vertical - 0.24) / 0.38; r = lerp(20, 14, u); g = lerp(42, 72, u); b = lerp(66, 92, u);
        } else { const u = (vertical - 0.62) / 0.38; r = lerp(14, 8, u); g = lerp(42, 29, u); b = lerp(66, 56, u); }
        const glow = Math.pow(clamp(band - 0.30, 0, 1), 1.9); const shadow = Math.pow(clamp(0.54 - band, 0, 1), 1.7);
        r += glow * 14 - shadow * 7; g += glow * 28 - shadow * 10; b += glow * 34 - shadow * 6;
        if (vertical < 0.18) { r += 12 + drift * 6; b += 12 + drift * 8; }
        return `rgb(${clamp(Math.round(r), 0, 255)}, ${clamp(Math.round(g), 0, 255)}, ${clamp(Math.round(b), 0, 255)})`;
      }
      function render(tms) {
        const t = tms * 0.001; drawBackground(t);
        const centerX = w * 0.5; const centerY = h * 0.44; const swayX = Math.sin(t * 0.32) * 16; const swayY = Math.cos(t * 0.24) * 10;
        for (const cell of grid) {
          const px = (cell.x - 1) * baseCell; const py = (cell.y - 1) * baseCell; const nx = px / w; const ny = py / h;
          const dist = Math.hypot((px - w * 0.5) / w, (py - h * 0.48) / h); const centerFalloff = 1 - clamp(dist * 1.85, 0, 1);
          const n = fbm(cell.x * 0.95, cell.y * 0.88, t + cell.seed * 0.01); const n2 = fbm(cell.x * 0.6 + 10, cell.y * 0.55 + 10, t * 0.7 + cell.seed * 0.02);
          const pulse = 0.45 + 0.55 * Math.sin(t * 0.8 + cell.seed * 0.02 + n * 4.0); const alive = clamp((n * 0.82 + n2 * 0.42 + pulse * 0.22) / 1.3, 0, 1);
          const density = clamp(0.22 + centerFalloff * 0.85, 0, 1); if (alive < 0.28 + (1 - density) * 0.24) continue;
          const size = cell.size * (0.62 + alive * 0.92);

        }

        haze.addColorStop(0, 'rgba(255,255,255,0.055)'); haze.addColorStop(0.5, 'rgba(255,255,255,0.018)'); haze.addColorStop(1, 'rgba(255,255,255,0)');

      }

    })();
